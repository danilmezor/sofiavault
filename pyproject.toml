[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofiavault"
version = "0.4.0"
description = "Encrypted secrets for your terminal, your servers and your app: a password manager, a .env replacement and a user credential store"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["password-manager", "security", "encryption", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
keyring = [
    "keyring>=24.0",
]
legacy-bcrypt = [
    "bcrypt>=4.0",
]

[project.scripts]
sofiavault = "sofiavault.cli:main"

[project.urls]
Homepage = "https://github.com/danilmezor/sofiavault"
Repository = "https://github.com/danilmezor/sofiavault"
Issues = "https://github.com/danilmezor/sofiavault/issues"

[tool.setuptools]
packages = ["sofiavault"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running or statistical tests (run in CI on one platform)",
]
