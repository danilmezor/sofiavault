[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofiavault"
version = "0.2.0"
description = "A secure terminal password manager with fuzzy matching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["password-manager", "security", "encryption", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
sofiavault = "sofiavault:main"

[project.urls]
Homepage = "https://github.com/danilmezor/sofiavault"
Repository = "https://github.com/danilmezor/sofiavault"
Issues = "https://github.com/danilmezor/sofiavault/issues"

[tool.setuptools]
py-modules = ["sofiavault"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
