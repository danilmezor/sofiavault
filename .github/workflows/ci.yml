name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          # The newest Ubuntu image no longer ships Python 3.9.
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the compatibility audit compares against the v0.3.0 tag

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,legacy-bcrypt]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v
